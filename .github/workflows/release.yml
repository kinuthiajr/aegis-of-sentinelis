name: Release Native AOT Engine

on:
  push:
    tags:
      - "v*" # Triggers when pushing tags like v1.0.0, v1.1.2

permissions:
  contents: write # Required for creating release assets

jobs:
  build-and-release:
    name: Build Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary_name: sentinelis-linux-x64
            exec_file: sentinelis
          - os: macos-latest
            rid: osx-x64
            binary_name: sentinelis-osx-x64
            exec_file: sentinelis
          - os: macos-latest
            rid: osx-arm64
            binary_name: sentinelis-osx-arm64
            exec_file: sentinelis
          - os: windows-latest
            rid: win-x64
            binary_name: sentinelis-win-x64.exe
            exec_file: sentinelis.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 1. Install Linux AOT prerequisites
      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # 2. Compile Native AOT Binary
      - name: Publish Native AOT Binary
        shell: bash
        run: |
          dotnet publish engine/Sentinelis.Cli/Sentinelis.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:SelfContained=true \
            -p:PublishTrimmed=true \
            -o ./publish

          # Rename binary to target artifact name
          mv "./publish/${{ matrix.exec_file }}" "./publish/${{ matrix.binary_name }}"

      # 3. Generate SHA-256 Checksum Asset
      - name: Generate SHA-256 Checksum
        shell: bash
        run: |
          cd publish
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.binary_name }}" > "${{ matrix.binary_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.binary_name }}" > "${{ matrix.binary_name }}.sha256"
          fi

          echo "Generated Checksum:"
          cat "${{ matrix.binary_name }}.sha256"

      # 4. Upload Assets to GitHub Release Tag
      - name: Upload Binary and Checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/${{ matrix.binary_name }}
            publish/${{ matrix.binary_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
